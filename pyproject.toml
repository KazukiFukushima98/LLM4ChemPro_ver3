[project]
name = "algorithm"
version = "0.1.0"
description = "LLM-driven superstructure transition for chemical process synthesis"
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "deap",
    "matplotlib",
    # ソルバー系は計算ノードでのみ必要。Mac(原稿ビルド機)には入れない。
    # Aspen COM は Windows 専用、torch 系は BO(botorch)専用。
    "pywin32; sys_platform == 'win32'",
    "pyDOE3",
    "pyyaml>=6.0.3",
    "botorch>=0.12; sys_platform != 'darwin'",
    "gpytorch>=1.13; sys_platform != 'darwin'",
    "torch>=2.4; sys_platform != 'darwin'",
]

# 原稿・スライドのビルド(quarto render)にだけ必要な依存。
# 計算ノードでは不要: uv sync --group docs で明示的に入れる。
[dependency-groups]
docs = [
    "pandas>=2.0",
    "pyarrow>=15",
    "jupyter",
]

# 作図関数パッケージ(src/paperfigs)を import 可能にするため、
# プロジェクト自体を editable インストールする。
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/paperfigs"]

# PyTorch CUDA wheel index (cu124 = CUDA 12.4, ホスト driver 12.5 と互換)。
# uv 標準パターン: explicit index にして torch のみを cu124 から取得し、他は PyPI から取得する。
[tool.uv.sources]
torch = [
    { index = "pytorch-cu124", marker = "sys_platform != 'darwin'" },
]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true
