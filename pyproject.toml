[project]
name = "algorithm"
version = "0.1.0"
description = "LLM-driven superstructure transition for chemical process synthesis"
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "deap",
    "matplotlib",
    "pywin32",
    "pyDOE3",
    "pyyaml>=6.0.3",
    "botorch>=0.12",
    "gpytorch>=1.13",
    "torch>=2.4",
]

# PyTorch CUDA wheel index (cu124 = CUDA 12.4, ホスト driver 12.5 と互換)。
# uv 標準パターン: explicit index にして torch のみを cu124 から取得し、他は PyPI から取得する。
[tool.uv.sources]
torch = [
    { index = "pytorch-cu124" },
]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true
